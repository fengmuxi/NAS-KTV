# Build NASKTV TV desktop apps (Windows / macOS) — NO code signing
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Desktop matrix:
#   Windows  x86_64-pc-windows-msvc (64)  +  i686-pc-windows-msvc (32)
#   macOS    x86_64-apple-darwin (64) + aarch64-apple-darwin (64)
#   NOTE: Linux desktop build removed by request.
#   NOTE: macOS 32-bit is impossible (Apple dropped it in Catalina 2019).
#   NOTE: No signing — outputs are unsigned sideload/debug builds.

name: Build TV Desktop

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager（pnpm@9.0.0，与 lockfileVersion 9.0 一致）单一来源决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: packages/tv-app
          args: --target ${{ matrix.target }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-desktop-${{ matrix.target }}
          # 只上传最终安装包（与 Release 上传保持一致）
          path: |
            packages/tv-app/src-tauri/target/**/release/bundle/nsis/*.exe
            packages/tv-app/src-tauri/target/**/release/bundle/msi/*.msi
            packages/tv-app/src-tauri/target/**/release/bundle/macos/*.tar.gz
            packages/tv-app/src-tauri/target/**/release/bundle/macos/*.dmg
            packages/tv-app/src-tauri/target/**/release/bundle/macos/*.app.zip
          if-no-files-found: warn

      - name: Upload to Release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # 只上传最终安装包，排除构建脚本/模板/图标等中间产物。
          # Tauri v2 产出：
          #   Windows: bundle/nsis/*.exe（NSIS 安装包）、bundle/msi/*.msi
          #   macOS:   bundle/macos/*.tar.gz / *.dmg / *.app.zip
          mapfile -t FILES < <(find packages/tv-app/src-tauri/target \
            -path '*/release/bundle/*' \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.app.zip' \) \
            -type f)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::未发现桌面端安装包 (.exe/.msi/.tar.gz/.dmg/.app.zip)"
            exit 1
          fi
          printf '上传 %d 个安装包:\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
