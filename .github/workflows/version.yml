# Version Management (release-please)
#
# Watches conventional commits on the default branch and:
#   - opens / updates a "Release vX.Y.Z" pull request
#   - on merge: bumps the version (SemVer), updates CHANGELOG.md,
#     creates the GitHub Release (notes generated from commits), and pushes a `vX.Y.Z` tag
#
# Commit message convention (conventional commits):
#   feat: new feature        -> minor bump (pre-1.0) / minor
#   fix: bug fix             -> patch bump
#   BREAKING CHANGE / !:     -> major bump
#   chore/docs/refactor/perf -> no version bump (still listed in notes)
#
# The `vX.Y.Z` tag then triggers release.yml to build & publish the artifacts.

name: Version Management

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # 允许本 workflow 通过 gh 显式触发 release.yml（无 PAT 时的兜底触发，见下方步骤）
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # 创建 Release / PR：配置了 RELEASE_PLEASE_TOKEN 时用 PAT（其创建的 release:published 能链式触发
          # release.yml）；未配置时退回 GITHUB_TOKEN（创建动作本身允许，tag 正常生成），改由下方
          # workflow_dispatch 兜底触发。两条路径互斥，不会重复构建。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # 兜底触发：本次确实发布了 Release、且未配置 PAT（避免与 release:published 重复触发）时，
      # 用 gh 显式调用 release.yml 的 workflow_dispatch。workflow_dispatch 是 GitHub 官方推荐的跨
      # workflow 触发方式，不受 GITHUB_TOKEN 反递归限制，因此无需配置 RELEASE_PLEASE_TOKEN 也能触发构建。
      - name: Trigger release build (workflow_dispatch fallback)
        if: ${{ steps.release.outputs.release_created && secrets.RELEASE_PLEASE_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml -f tag="$TAG"
