# Version Management (release-please)
#
# Watches conventional commits on the default branch and:
#   - opens / updates a "Release vX.Y.Z" pull request
#   - on merge: bumps the version (SemVer), updates CHANGELOG.md,
#     creates the GitHub Release (notes generated from commits), and pushes a `vX.Y.Z` tag
#
# Commit message convention (conventional commits):
#   feat: new feature        -> minor bump (pre-1.0) / minor
#   fix: bug fix             -> patch bump
#   BREAKING CHANGE / !:     -> major bump
#   chore/docs/refactor/perf -> no version bump (still listed in notes)
#
# The `vX.Y.Z` tag then triggers release.yml to build & publish the artifacts.

name: Version Management

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # 允许本 workflow 通过 gh 显式触发 release.yml（无 PAT 时的兜底触发，见下方步骤）
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # 创建 Release / PR：配置了 RELEASE_PLEASE_TOKEN 时用 PAT（其创建的 release:published 能链式触发
          # release.yml）；未配置时退回 GITHUB_TOKEN（创建动作本身允许，tag 正常生成），改由下方
          # workflow_dispatch 兜底触发。两条路径互斥，不会重复构建。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # 兜底触发：本次确实发布了 Release 时，用 gh 显式调用 release.yml 的 workflow_dispatch。
      # workflow_dispatch 是 GitHub 官方推荐的跨 workflow 触发方式，不受 GITHUB_TOKEN 反递归限制。
      # 注意：if 表达式不能直接引用 secrets 上下文（GitHub 限制），所以 secrets 判断放在 run 脚本内部。
      - name: Trigger release build (workflow_dispatch fallback)
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          # 将「是否配置了 PAT」传入脚本；空字符串 = 未配置
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && 'true' || 'false' }}
        run: |
          echo "=== Dispatch Fallback Debug ==="
          echo "HAS_PAT=${HAS_PAT}"
          echo "TAG='${TAG}'"
          echo "release_created=${{ steps.release.outputs.release_created }}"
          if [ "$HAS_PAT" = "true" ]; then
            echo "::notice::RELEASE_PLEASE_TOKEN 已配置，release:published 将自动触发 release.yml，跳过 dispatch"
            exit 0
          fi
          if [ -z "$TAG" ]; then
            echo "::error::tag_name 输出为空，无法触发 release.yml"
            exit 1
          fi
          echo "::notice::通过 workflow_dispatch 触发 release.yml (tag=${TAG})"
          gh workflow run release.yml -f tag="$TAG" 2>&1 || {
            echo "::error::gh workflow run 失败 (exit code: $?)"
            exit 1
          }
          echo "✅ dispatch 成功"
