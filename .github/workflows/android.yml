# Build NASKTV TV Android APKs (arm64-v8a 64-bit / armeabi-v7a 32-bit) — NO signing
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Outputs are unsigned debug/sideload APKs (no release keystore).

name: Build TV Android

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager（pnpm@9.0.0，与 lockfileVersion 9.0 一致）单一来源决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: |
          # 注意：platforms 版本必须与 src-tauri/gen/android/app/build.gradle.kts 的
          # compileSdk(=36) / targetSdk(=36) 一致，否则 gradle 配置阶段报
          # "Failed to find Platform android-36" 导致 tauri build exit code 2。
          sdkmanager "ndk;26.1.10909125" "platforms;android-36" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Build APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # cargo-ndk 需要 NDK major version 来确定 ABI / 链接方式
          CARGO_NDK_VERSION: 26
        run: |
          # 直接调用 tauri CLI 的 android build 子命令。
          # 不用 tauri-action 的 includeAndroid + args 转发：它最终会把命令拼成
          # `tauri build -- --target <triple> --apk`（桌面模式），而 --apk 在
          # 桌面模式下是非法参数，导致 exit code 2。
          # 命令与 AGENTS.md 一致：pnpm exec tauri android build --target <triple> --apk
          # （packages/tv-app 的 package.json 有 "tauri": "tauri" 脚本，
          #  用 pnpm exec 直接调二进制可避免经 npm 脚本错拼子命令。）
          cd packages/tv-app
          pnpm exec tauri android build --target ${{ matrix.target }} --apk

      - name: Prepare APK
        run: |
          UNSIGNED=$(find packages/tv-app/src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          cp "$UNSIGNED" "nasktv-tv-${{ matrix.arch }}.apk"

      - name: Upload to Release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "nasktv-tv-${{ matrix.arch }}.apk" --clobber --repo "${{ github.repository }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-${{ matrix.arch }}
          path: nasktv-tv-${{ matrix.arch }}.apk
          if-no-files-found: warn
