# Build NASKTV TV Android APKs (arm64-v8a 64-bit / armeabi-v7a 32-bit) — NO signing
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Outputs are unsigned debug/sideload APKs (no release keystore).

name: Build TV Android

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager（pnpm@9.0.0，与 lockfileVersion 9.0 一致）单一来源决定

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: |
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Build APK with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: packages/tv-app
          includeAndroid: true
          args: --target ${{ matrix.target }} --apk

      - name: Prepare APK
        run: |
          UNSIGNED=$(find packages/tv-app/src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          cp "$UNSIGNED" "nasktv-tv-${{ matrix.arch }}.apk"

      - name: Upload to Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: nasktv-tv-${{ matrix.arch }}.apk

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-android-${{ matrix.arch }}
          path: nasktv-tv-${{ matrix.arch }}.apk
          if-no-files-found: warn
