# Build & push NASKTV Docker images (backend / separator / web)
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Required repo/environment secrets:
#   ALIYUN_ACR_REGISTRY   e.g. registry.cn-hangzhou.aliyuncs.com
#   ALIYUN_ACR_USERNAME   ACR login username (usually RAM AccessKeyId)
#   ALIYUN_ACR_PASSWORD   ACR login password (usually RAM AccessKeySecret)
#   ALIYUN_ACR_NAMESPACE  image namespace, e.g. nasktv
#
# Images are pushed to a SINGLE repository, distinguished by tag prefix:
#   <REGISTRY>/<NAMESPACE>/nasktv:backend-<semver>
#   <REGISTRY>/<NAMESPACE>/nasktv:separator-<semver>
#   <REGISTRY>/<NAMESPACE>/nasktv:web-<semver>
# Each also gets a <service>-<major>.<minor> tag (e.g. backend-0.2),
# and — only on a real release (inputs.tag provided) — a <service>-latest tag.
# Platform: linux/amd64 only — 部署目标为 x86（separator 配 NVIDIA GPU）。arm64 需 QEMU
# 模拟，重 Node 构建（pnpm install / vite build）会触发 "Illegal instruction" 崩溃，故不构建。

name: Build Docker Images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # 有 tag 用 tag 版本（精确匹配 Release），无 tag 从 manifest 同步
          # （release-please 每次 Release PR 合并后 manifest 已 bump 并提交到 main）
          if [ -n "$TAG" ]; then
            node scripts/set-version.mjs "${TAG#v}"
          else
            node scripts/set-version.mjs
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          TAG: ${{ inputs.tag || github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VER="${TAG#v}"
          BASE="${REGISTRY}/${NAMESPACE}/nasktv"
          {
            echo "tags<<EOF"
            echo "${BASE}:${{ matrix.name }}-${VER}"
            echo "${BASE}:${{ matrix.name }}-${VER%.*}"
            # 真实发布（提供了 tag）时额外打 latest 标签，便于生产部署引用
            if [ -n "${INPUT_TAG}" ]; then
              echo "${BASE}:${{ matrix.name }}-latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # ACR 不兼容 buildx 默认的 provenance/SBOM attestation 空清单
          # (application/vnd.oci.empty.v1+json)，会导致推送报
          # "denied: unknown manifest class"。关闭后回退为标准 docker manifest v2。
          provenance: false
          sbom: false
          # 前端构建期参数：web 镜像构建时注入；backend/separator 镜像虽不消费该参数，
          # 但已在各自 Dockerfile 顶部声明 ARG，以消除 buildx "build arg 未消费" 告警。
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
