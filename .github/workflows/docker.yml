# Build & push NASKTV Docker images (backend / separator / web)
#
# Reusable workflow: call from release.yml (with `tag`), or dispatch manually.
#
# Required repo/environment secrets:
#   ALIYUN_ACR_REGISTRY   e.g. registry.cn-hangzhou.aliyuncs.com
#   ALIYUN_ACR_USERNAME   ACR login username (usually RAM AccessKeyId)
#   ALIYUN_ACR_PASSWORD   ACR login password (usually RAM AccessKeySecret)
#   ALIYUN_ACR_NAMESPACE  image namespace, e.g. nasktv
#
# Images are pushed to a SINGLE repository, distinguished by tag prefix:
#   <REGISTRY>/<NAMESPACE>/nasktv:backend-<semver>
#   <REGISTRY>/<NAMESPACE>/nasktv:separator-<semver>
#   <REGISTRY>/<NAMESPACE>/nasktv:web-<semver>
# Each also gets a <service>-<major>.<minor> tag (e.g. backend-0.2).
# Multi-arch: linux/amd64 + linux/arm64 (separator is CPU torch, safe for both).

name: Build Docker Images

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: ''
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: packages/backend/Dockerfile
          - name: separator
            context: packages/separator
            dockerfile: packages/separator/Dockerfile
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version to tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "${TAG#v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          VER="${TAG#v}"
          BASE="${REGISTRY}/${NAMESPACE}/nasktv"
          {
            echo "tags<<EOF"
            echo "${BASE}:${{ matrix.name }}-${VER}"
            echo "${BASE}:${{ matrix.name }}-${VER%.*}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
