[project]
name = "nasktv-downloader"
version = "0.4.0"
description = "NASKTV Song Downloader Microservice (musicdl)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "mutagen>=1.47.0",
    "pycryptodome>=3.19.0",
    "musicdl>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
